# =============================================================
# Zabbix Helm Chart Values - k3s / crm-multitenant
# Chart: zabbix-community/helm-zabbix
# Stack: Server + PostgreSQL + Web UI + Agent2 DaemonSet
# Acceso: http://181.209.94.221:8081  (NAT 8081 -> NodePort 30081)
# =============================================================

# ----------------------------------------------------------
# PostgreSQL
# ----------------------------------------------------------
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  postgresqlUsername: zabbix
  postgresqlPassword: zabbix
  postgresqlDatabase: zabbix
  persistence:
    enabled: true
    storageClass: "local-path"
    size: 8Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# ----------------------------------------------------------
# Zabbix Server
# ----------------------------------------------------------
zabbixServer:
  enabled: true
  image:
    repository: zabbix/zabbix-server-pgsql
    tag: ubuntu-7.2-latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  extraEnv:
    - name: ZBX_DEBUGLEVEL
      value: "3"
    - name: ZBX_TIMEOUT
      value: "30"
    - name: ZBX_STARTPOLLERS
      value: "5"
    - name: ZBX_STARTPOLLERSUNREACHABLE
      value: "1"
    - name: ZBX_STARTPINGERS
      value: "1"
    - name: ZBX_STARTDISCOVERERS
      value: "1"
    - name: ZBX_STARTHTTPPOLLERS
      value: "1"
  service:
    type: ClusterIP
    port: 10051
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# ----------------------------------------------------------
# Zabbix Web UI
# NodePort 30081 -> nattear puerto 8081 a este
# URL final: http://181.209.94.221:8081
# ----------------------------------------------------------
zabbixWeb:
  enabled: true
  image:
    repository: zabbix/zabbix-web-nginx-pgsql
    tag: ubuntu-7.2-latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  extraEnv:
    - name: PHP_TZ
      value: "America/Argentina/Buenos_Aires"
    - name: ZBX_SERVER_NAME
      value: "Zabbix k3s"
  service:
    type: NodePort
    port: 80
    nodePort: 30081
  ingress:
    enabled: false
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ----------------------------------------------------------
# Zabbix Agent 2 (DaemonSet - un pod por nodo)
# ----------------------------------------------------------
zabbixAgent:
  enabled: true
  image:
    repository: zabbix/zabbix-agent2
    tag: ubuntu-7.2-latest
    pullPolicy: IfNotPresent
  extraEnv:
    - name: ZBX_HOSTNAME
      value: "Assigned by cluster"
    - name: ZBX_PASSIVE_ALLOW
      value: "true"
    - name: ZBX_ACTIVE_ALLOW
      value: "true"
    - name: ZBX_DEBUGLEVEL
      value: "3"
    - name: ZBX_TIMEOUT
      value: "30"
  hostNetwork: false
  hostPID: false
  securityContext:
    privileged: false
    runAsUser: 0
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  extraVolumeMounts:
    - name: proc
      mountPath: /host/proc
      readOnly: true
    - name: sys
      mountPath: /host/sys
      readOnly: true
  extraVolumes:
    - name: proc
      hostPath:
        path: /proc
    - name: sys
      hostPath:
        path: /sys

# ----------------------------------------------------------
# kube-state-metrics
# ----------------------------------------------------------
kube-state-metrics:
  enabled: true
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# ----------------------------------------------------------
# Zabbix Proxy - DESHABILITADO
# ----------------------------------------------------------
zabbixProxy:
  enabled: false
