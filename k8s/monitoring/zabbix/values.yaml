# =============================================================
# Zabbix Helm Chart Values - k3s / crm-multitenant
# Chart: zabbix-community/zabbix v4.4.1
# Acceso: http://181.209.94.221:30081
# =============================================================

# -- Tag global de imagen (aplica a todos los componentes)
zabbixImageTag: ubuntu-7.2-latest

# -- Credenciales centralizadas de base de datos
db_access:
  unifiedSecretName: zabbix-db-secret
  unifiedSecretAutoCreate: true
  db_server_host: zabbix-postgresql
  db_server_port: "5432"
  postgres_user: zabbix
  postgres_password: zabbix
  postgres_db: zabbix

# ----------------------------------------------------------
# PostgreSQL
# ----------------------------------------------------------
postgresql:
  enabled: true
  persistence:
    enabled: true
    storageClass: "local-path"
    size: 8Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# ----------------------------------------------------------
# Zabbix Server
# ----------------------------------------------------------
zabbixServer:
  enabled: true
  replicaCount: 1
  podAntiAffinity: false
  service:
    type: ClusterIP
    port: 10051
  extraEnv:
    - name: ZBX_DEBUGLEVEL
      value: "3"
    - name: ZBX_TIMEOUT
      value: "30"
    - name: ZBX_STARTPOLLERS
      value: "5"
    - name: ZBX_STARTDISCOVERERS
      value: "1"
    - name: ZBX_STARTHTTPPOLLERS
      value: "1"
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# ----------------------------------------------------------
# Zabbix Web UI
# NodePort 30081 -> NAT 30081 -> http://181.209.94.221:30081
# ----------------------------------------------------------
zabbixWeb:
  enabled: true
  replicaCount: 1
  service:
    type: NodePort
    port: 80
    nodePort: 30081
  extraEnv:
    - name: PHP_TZ
      value: "America/Argentina/Buenos_Aires"
    - name: ZBX_SERVER_NAME
      value: "Zabbix k3s"
  ingress:
    enabled: false
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ----------------------------------------------------------
# Zabbix Agent 2 (DaemonSet - un pod por nodo)
# ----------------------------------------------------------
zabbixAgent:
  enabled: true
  ZBX_PASSIVE_ALLOW: true
  ZBX_ACTIVE_ALLOW: true
  ZBX_DEBUGLEVEL: 3
  ZBX_TIMEOUT: 4
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# ----------------------------------------------------------
# Zabbix Webservice
# ----------------------------------------------------------
zabbixWebService:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# ----------------------------------------------------------
# Zabbix Proxy - DESHABILITADO
# ----------------------------------------------------------
zabbixProxy:
  enabled: false
