# =============================================================
# Zabbix Helm Chart Values - k3s / crm-multitenant
# Ref: https://git.zabbix.com/projects/ZT/repos/kubernetes-helm
# =============================================================

nameOverride: "zabbix"
namespaceOverride: "monitoring"

# -- Service Account creado manualmente via rbac.yaml
serviceAccount:
  create: false
  name: zabbix

# ----------------------------------------------------------
# Zabbix Proxy (modo activo -> conecta al Zabbix Server)
# ----------------------------------------------------------
zabbixProxy:
  enabled: true
  image:
    repository: zabbix/zabbix-proxy-sqlite3
    tag: alpine-7.2-latest
    pullPolicy: IfNotPresent
  replicaCount: 1

  env:
    # ⚠️  Reemplazar con la IP/hostname real de tu Zabbix Server
    - name: ZBX_SERVER_HOST
      value: "ZABBIX_SERVER_IP_OR_HOSTNAME"
    - name: ZBX_SERVER_PORT
      value: "10051"
    # Nombre del proxy tal como esta registrado en Zabbix Server
    - name: ZBX_HOSTNAME
      value: "k3s-zabbix-proxy"
    - name: ZBX_PROXYMODE
      value: "0"          # 0 = activo, 1 = pasivo
    - name: ZBX_DEBUGLEVEL
      value: "3"
    - name: ZBX_TIMEOUT
      value: "30"
    - name: ZBX_CONFIGFREQUENCY
      value: "120"
    - name: ZBX_DATASENDERFREQUENCY
      value: "1"

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  service:
    type: ClusterIP
    port: 10051

# ----------------------------------------------------------
# Zabbix Agent 2 (DaemonSet - un pod por nodo)
# ----------------------------------------------------------
zabbixAgent:
  enabled: true
  image:
    repository: zabbix/zabbix-agent2
    tag: alpine-7.2-latest
    pullPolicy: IfNotPresent

  # El agente reporta al proxy local (no al server directamente)
  env:
    - name: ZBX_SERVER_HOST
      value: "zabbix-proxy"    # Service name del proxy dentro del cluster
    - name: ZBX_SERVER_PORT
      value: "10051"
    - name: ZBX_HOSTNAME
      value: "Assigned by cluster"
    - name: ZBX_PASSIVE_ALLOW
      value: "true"
    - name: ZBX_ACTIVE_ALLOW
      value: "true"
    - name: ZBX_DEBUGLEVEL
      value: "3"

  hostNetwork: false
  hostPID: false

  securityContext:
    privileged: false
    runAsUser: 0

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  extraVolumeMounts:
    - name: proc
      mountPath: /host/proc
      readOnly: true
    - name: sys
      mountPath: /host/sys
      readOnly: true

  extraVolumes:
    - name: proc
      hostPath:
        path: /proc
    - name: sys
      hostPath:
        path: /sys

# ----------------------------------------------------------
# kube-state-metrics (expone metricas del estado del cluster)
# ----------------------------------------------------------
kube-state-metrics:
  enabled: true
  image:
    tag: v2.13.0
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# ----------------------------------------------------------
# Zabbix Server embebido - DESHABILITADO
# (usamos Zabbix Server externo)
# ----------------------------------------------------------
zabbixServer:
  enabled: false

zabbixWeb:
  enabled: false

postgresql:
  enabled: false
