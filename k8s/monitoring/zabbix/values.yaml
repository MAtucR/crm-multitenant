# =============================================================
# Zabbix Helm Chart Values - k3s / crm-multitenant
# Stack completo: Server + PostgreSQL + Web UI + Agent2 DaemonSet
# Ref: https://git.zabbix.com/projects/ZT/repos/kubernetes-helm
# =============================================================

nameOverride: "zabbix"
namespaceOverride: "monitoring"

# -- Service Account creado via rbac.yaml
serviceAccount:
  create: false
  name: zabbix

# ----------------------------------------------------------
# PostgreSQL (base de datos del Zabbix Server)
# ----------------------------------------------------------
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent

  auth:
    postgresPassword: "zabbix"
    username: "zabbix"
    password: "zabbix"
    database: "zabbix"

  primary:
    persistence:
      enabled: true
      storageClass: "local-path"   # storage class por defecto en k3s
      size: 8Gi

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# ----------------------------------------------------------
# Zabbix Server
# ----------------------------------------------------------
zabbixServer:
  enabled: true
  image:
    repository: zabbix/zabbix-server-pgsql
    tag: alpine-7.2-latest
    pullPolicy: IfNotPresent
  replicaCount: 1

  env:
    - name: DB_SERVER_HOST
      value: "zabbix-postgresql"   # Service name de PostgreSQL
    - name: DB_SERVER_PORT
      value: "5432"
    - name: POSTGRES_USER
      value: "zabbix"
    - name: POSTGRES_PASSWORD
      value: "zabbix"
    - name: POSTGRES_DB
      value: "zabbix"
    - name: ZBX_DEBUGLEVEL
      value: "3"
    - name: ZBX_TIMEOUT
      value: "30"
    - name: ZBX_STARTPOLLERS
      value: "5"
    - name: ZBX_STARTPOLLERSUNREACHABLE
      value: "1"
    - name: ZBX_STARTPINGERS
      value: "1"
    - name: ZBX_STARTDISCOVERERS
      value: "1"
    - name: ZBX_STARTHTTPPOLLERS
      value: "1"

  service:
    type: ClusterIP
    port: 10051

  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# ----------------------------------------------------------
# Zabbix Web UI (Nginx + PHP-FPM)
# ----------------------------------------------------------
zabbixWeb:
  enabled: true
  image:
    repository: zabbix/zabbix-web-nginx-pgsql
    tag: alpine-7.2-latest
    pullPolicy: IfNotPresent
  replicaCount: 1

  env:
    - name: DB_SERVER_HOST
      value: "zabbix-postgresql"
    - name: DB_SERVER_PORT
      value: "5432"
    - name: POSTGRES_USER
      value: "zabbix"
    - name: POSTGRES_PASSWORD
      value: "zabbix"
    - name: POSTGRES_DB
      value: "zabbix"
    - name: ZBX_SERVER_HOST
      value: "zabbix-server"       # Service name del Zabbix Server
    - name: ZBX_SERVER_PORT
      value: "10051"
    - name: PHP_TZ
      value: "America/Argentina/Buenos_Aires"

  service:
    type: ClusterIP
    port: 8080

  # Ingress para acceder a la UI desde fuera del cluster
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: traefik
    hosts:
      - host: zabbix.crm.local   # Cambiar por tu dominio real
        paths:
          - path: /
            pathType: Prefix

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ----------------------------------------------------------
# Zabbix Agent 2 (DaemonSet - un pod por nodo del cluster)
# ----------------------------------------------------------
zabbixAgent:
  enabled: true
  image:
    repository: zabbix/zabbix-agent2
    tag: alpine-7.2-latest
    pullPolicy: IfNotPresent

  env:
    - name: ZBX_SERVER_HOST
      value: "zabbix-server"       # Service name del Zabbix Server
    - name: ZBX_SERVER_PORT
      value: "10051"
    - name: ZBX_HOSTNAME
      value: "Assigned by cluster"
    - name: ZBX_PASSIVE_ALLOW
      value: "true"
    - name: ZBX_ACTIVE_ALLOW
      value: "true"
    - name: ZBX_DEBUGLEVEL
      value: "3"
    - name: ZBX_TIMEOUT
      value: "30"

  hostNetwork: false
  hostPID: false

  securityContext:
    privileged: false
    runAsUser: 0

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  # Acceso a /proc y /sys del nodo host para metricas de sistema
  extraVolumeMounts:
    - name: proc
      mountPath: /host/proc
      readOnly: true
    - name: sys
      mountPath: /host/sys
      readOnly: true

  extraVolumes:
    - name: proc
      hostPath:
        path: /proc
    - name: sys
      hostPath:
        path: /sys

# ----------------------------------------------------------
# kube-state-metrics (estado de recursos del cluster)
# ----------------------------------------------------------
kube-state-metrics:
  enabled: true
  image:
    tag: v2.13.0
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# ----------------------------------------------------------
# Zabbix Proxy - DESHABILITADO
# (no se necesita, el server esta en el mismo cluster)
# ----------------------------------------------------------
zabbixProxy:
  enabled: false
