# =============================================================
# ArgoCD Application - Zabbix Full Stack (Helm)
# Stack: Server + PostgreSQL + Web UI + Agent2 DaemonSet
# Sincronizado desde: https://github.com/MAtucR/crm-multitenant
# =============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zabbix-monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: crm-multitenant
    monitoring: zabbix
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Multi-source: Helm chart oficial + values desde este repo
  sources:
    - repoURL: https://zabbix.github.io/helm-charts
      chart: zabbix-helm-chrt
      targetRevision: 1.4.0
      helm:
        releaseName: zabbix
        valueFiles:
          - $values/k8s/monitoring/zabbix/values.yaml

    - repoURL: https://github.com/MAtucR/crm-multitenant
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
    - group: apps
      kind: DaemonSet
      jsonPointers:
        - /spec/template/spec/containers/0/resources
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
